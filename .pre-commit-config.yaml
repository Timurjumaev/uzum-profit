# O'rnatish: uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # Sirlar va real ma'lumot repozitoriyga kirmaydi (CLAUDE.md).
      - id: forbid-new-submodules
  - repo: local
    hooks:
      - id: no-secrets-or-data
        name: .env, *.db, uzum_history.json, uzum_samples*.json taqiqlangan
        entry: "taqiqlangan fayl: .env, *.db, uzum_history.json, uzum_samples*.json, realcheck*.json repozitoriyga kirmaydi"
        language: fail
        # uzum_cassette*.json (record_uzum.py chiqishi) ildizda — tekshirilmagan; fixtures/uzum/ ga ko'rib chiqilgach.
        files: '(^|/)(\.env|.*\.db|uzum_history\.json|uzum_samples.*\.json)$|^uzum_cassette.*\.json$|(^|/)realcheck.*\.json$'
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: '^(uzum_profit|tests)/'
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: '^(uzum_profit|tests)/'
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
