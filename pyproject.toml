# uv workspace: yangi tizimning Python paketlari (03-arxitektura.md §3).
# Legacy ilova (uzum_profit/, tests/) bu workspace'ga kirmaydi — Python 3.8 stdlib, alohida ishlaydi.
[project]
name = "uzum-profit-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["upcore", "upapi", "upbot"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/bot"]

[tool.uv.sources]
upcore = { workspace = true }
upapi = { workspace = true }
upbot = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    "pre-commit>=4",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["packages/core/tests", "apps/api/tests", "apps/bot/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Legacy ilova Python 3.8 uchun yozilgan va B4 gacha faqat kritik tuzatish oladi.
extend-exclude = ["./uzum_profit", "./tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["packages/core/src", "apps/api/src", "apps/bot/src"]
mypy_path = ["packages/core/src", "apps/api/src", "apps/bot/src"]
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "upcore.*"
strict = true
