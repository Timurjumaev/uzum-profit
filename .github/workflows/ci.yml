# CI (03-arxitektura.md §13): har PR va main'ga push.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (core, api, bot)
    runs-on: ubuntu-24.04
    # RLS va migratsiya testlari (B2.2) haqiqiy PostgreSQL'da; CI'da DB bo'lmasa testlar xato beradi.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      UP_TEST_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # OpenAPI sxemasi (frontend tiplari manbasi) kod bilan bir xil (03 §8, §13).
      - run: uv run python -m upapi.openapi --check
      # Domen yadrosi qamrovi ≥ 95% (03-arxitektura.md §12).
      - run: uv run pytest --cov=upcore --cov-report=term-missing --cov-fail-under=95
      # API qamrovi ≥ 80% (03-arxitektura.md §12).
      - run: uv run pytest apps/api/tests --cov=upapi --cov-report=term-missing --cov-fail-under=80
      # Tezlik testlari (03 §7, §11) — coverage'siz, aks holda vaqt o'lchovi buziladi.
      - run: uv run pytest -m benchmark

  legacy:
    name: Legacy (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.8", "3.13", "3.15"]  # 3.15 — Temurning Mac'i (2026-10)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      # Legacy faqat stdlib ishlatadi; uv workspace'ga kirmaydi.
      - run: $(uv python find ${{ matrix.python }} --no-project) -m unittest tests.test_all

  core-315:
    name: Core (Python 3.15)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.15
      # Temurning Mac'idagi Python: yadro va B1.9 solishtirish skripti (faqat stdlib) shu yerda ham ishlashi shart.
      - run: uv run --no-project --python 3.15 --with pytest --with hypothesis pytest packages/core/tests -p no:cacheprovider
        env:
          PYTHONPATH: packages/core/src

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API tiplari openapi.json dan generatsiya qilingan va yangi (farq bo'lsa — `pnpm --filter web api:types`).
      - run: pnpm --filter web api:types && git diff --exit-code -- apps/web/src/lib/api/schema.d.ts
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm --filter web size  # boshlang'ich JS ≤ 250 KB gzip (03 §9)

  e2e:
    name: E2E va vizual (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Kirish, onboarding, karkas (soxta API); axe KONTRAST bilan; skrinshot asoslari (e2e/__screenshots__) bilan taqqoslash.
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  compose:
    name: Dev muhit (docker compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/compose/dev.yml up --build --detach --wait --wait-timeout 300
      - run: curl --fail --silent http://localhost:8000/health
      - run: make seed
      - run: make db-check
      # Ishchi (B2.6) migratsiyadan keyin navbatni tinglaydi va yiqilmagan.
      - run: sleep 5 && docker compose -f infra/compose/dev.yml ps --status running --services | grep -qx worker
      - run: curl --fail --silent http://localhost:5173/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose -f infra/compose/dev.yml logs
      - if: always()
        run: docker compose -f infra/compose/dev.yml down --volumes

  staging:
    name: Staging (compose, Caddy HTTPS, deploy, zaxira)
    runs-on: ubuntu-24.04
    # Serverdagi oqimning o'zi (B2.10): gen-env → deploy.sh (strict staging tekshiruvlari bilan) → zaxira → tiklash →
    # qayta deploy. Domen `localhost` — Caddy ichki CA bilan HTTPS beradi (curl -k).
    env:
      UP_ROOT: ${{ github.workspace }}
      UP_TAG: ci
      UP_SKIP_PULL: "1"
      UP_HEALTH_INSECURE: "1"
      COMPOSE: docker compose -f infra/compose/staging.yml --env-file .env
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x infra/staging/*.sh infra/backup/*.sh infra/compose/postgres-init-staging/*.sh
      - run: infra/staging/gen-env.sh localhost
        env:
          UP_TELEGRAM_GATEWAY_TOKEN: ci-not-a-real-token
      - run: $COMPOSE build
      - run: docker run --rm -e UP_DOMAIN=localhost ghcr.io/timurjumaev/uzum-profit-web:ci caddy validate --config /etc/caddy/Caddyfile
      - run: infra/staging/deploy.sh ci
      - name: HTTPS, web, API, xavfsizlik sarlavhalari
        run: |
          curl -fsSk https://localhost/health | grep -q '"env":"staging"'
          curl -fsSk https://localhost/api/v1/health | grep -q '"status":"ok"'
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
          curl -fsSk https://localhost/biror/sahifa | grep -q '<div id="root">'  # SPA marshrutlari
          headers=$(curl -fsSkI https://localhost/)
          for h in strict-transport-security content-security-policy x-content-type-options x-frame-options; do
            grep -qi "^$h:" <<<"$headers" || { echo "sarlavha yo'q: $h"; exit 1; }
          done
          if grep -qi '^server:' <<<"$headers"; then echo "Server sarlavhasi ochiq"; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
      - name: Real sinov hisoboti (B2.11) — image ichida, up_app bilan; ulangan do'kon yo'q
        run: |
          code=0; infra/staging/realcheck.sh > realcheck.json 2> realcheck.err || code=$?
          cat realcheck.err
          test "$code" = 1 && grep -q "Ulangan do'kon yo'q" realcheck.err
          python3 -c "import json; assert json.load(open('realcheck.json'))['orgs'] == []"
      - name: Zaxira va tiklash
        run: |
          infra/backup/backup.sh ci
          dump=$(ls backups/*-ci.dump)
          $COMPOSE exec -T postgres psql -U uzum -d uzum -c "CREATE TABLE ci_marker (x int)"
          infra/backup/restore.sh "$dump"
          test "$($COMPOSE exec -T postgres psql -U uzum -d uzum -tAc "SELECT to_regclass('ci_marker') IS NULL")" = t
          $COMPOSE exec -T api python -m upapi.db.guard  # tiklangan bazada ham ilova roli RLS'ga bo'ysunadi
          curl -fsSk https://localhost/health
      - name: Qayta deploy (oldingi versiya saqlanadi)
        run: |
          for n in api web; do docker tag ghcr.io/timurjumaev/uzum-profit-$n:ci ghcr.io/timurjumaev/uzum-profit-$n:ci2; done
          infra/staging/deploy.sh ci2
          test "$(cat .deployed-tag)" = ci2
          docker image inspect ghcr.io/timurjumaev/uzum-profit-api:ci >/dev/null
      - if: failure()
        run: $COMPOSE logs
      - if: always()
        run: $COMPOSE down --volumes
