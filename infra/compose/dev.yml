# Lokal muhit (03-arxitektura.md §14). Ishga tushirish: `make dev`.
# Parollar faqat lokal dev uchun; staging/prod sirlari `.env`/Docker secrets'da.
name: uzum-profit-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: uzum
      POSTGRES_PASSWORD: uzum
      POSTGRES_DB: uzum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzum -d uzum"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      # Ilova — up_app (RLS'ga bo'ysunadi); migratsiya va seed — jadvallar egasi (faqat dev'da shu konteynerda).
      UP_DATABASE_URL: postgresql://up_app:up_app@postgres:5432/uzum
      UP_MIGRATION_DATABASE_URL: postgresql://uzum:uzum@postgres:5432/uzum
    command: ["uvicorn", "upapi.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
              "--reload-dir", "/app/apps/api/src", "--reload-dir", "/app/packages/core/src"]
    volumes:
      - ../../apps/api/src:/app/apps/api/src:ro
      - ../../packages/core/src:/app/packages/core/src:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Fon ishchisi (B2.6): Procrastinate navbati — sinxron ishlari. Migratsiyagacha (`make migrate`) kutib turadi.
  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      UP_DATABASE_URL: postgresql://up_app:up_app@postgres:5432/uzum
    command: ["python", "-m", "upapi.worker"]
    volumes:
      - ../../apps/api/src:/app/apps/api/src:ro
      - ../../packages/core/src:/app/packages/core/src:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-slim
    working_dir: /repo
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      API_PROXY_TARGET: http://api:8000
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web dev --host 0.0.0.0 --port 5173"]
    volumes:
      - ../..:/repo
      - node_modules:/repo/node_modules
      - web_node_modules:/repo/apps/web/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  web_node_modules:
