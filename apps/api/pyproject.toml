[project]
name = "upapi"
version = "0.0.0"
description = "Backend: FastAPI + worker + migratsiyalar"
requires-python = ">=3.13,<3.14"
dependencies = [
    "upcore",
    "fastapi>=0.161",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "httpx>=0.28",
    "cryptography>=46",
    "procrastinate>=3",
]

[tool.uv.sources]
upcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upapi"]
